# 草稿：待用户点头后放进 fork（foxhoundhcm/ninfer-all）的 .github/workflows/ 下再推。
# 设计要点（与本机配方一致，见 docs/llama-server-params/ninfer-all-sm89-selfbuild-20261005.md）：
#  · 一个 workflow + matrix{apps, bench} = 两条独立 job（各自 runner、各自产物、互不阻塞）
#  · apps job 出 ninfer-serve.exe 等 5 个 app（ninfer.exe 与它同属 NINFER_BUILD_APPS，分不开）
#  · bench job 出 bench/ninfer_bench.exe + ninfer_benches.exe（NINFER_BUILD_APPS=OFF + NINFER_BUILD_BENCHMARKS=ON）
#  · ⚠️ 上游 CI 的依赖用“空 .lib”stub（他们只编 host 代码、不链接）；我们真链接，故这里从 DLL 导出表现场造真 MSVC import lib
#  · CUDA 钉 13.1.0（与本机 nvcc 13.1.115 同源）；URL 已实测存在（13.1.1/13.1.2 是 404）
name: Build ninfer-all for RTX 4090 (sm_89, Windows)

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA toolkit version directory (e.g. 13.1.0)
        default: '13.1.0'
        type: string
      cuda_short:
        description: CUDA short version (e.g. 13.1)
        default: '13.1'
        type: string
      cuda_installer:
        description: network installer file name
        default: 'cuda_13.1.0_windows_network.exe'
        type: string
      ref:
        description: branch, tag or FULL 40-char SHA to build (blank = the commit that triggered this run)
        default: ''
        type: string
      targets:
        description: which binaries to build (apps | bench | both)
        default: both
        type: choice
        options: [both, apps, bench]
      sccache_version:
        description: sccache version to install (compile cache)
        default: '0.18.0'
        type: string

jobs:
  build:
    name: ${{ matrix.scope }} (sm_89, CUDA ${{ inputs.cuda_short }})
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # ⚠️ job 级 if 不能用 matrix（GitHub 报 Unrecognized named-value: 'matrix'）→ 改用动态矩阵
      matrix:
        scope: ${{ fromJSON(inputs.targets == 'apps' && '["apps"]' || inputs.targets == 'bench' && '["bench"]' || '["apps","bench"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ ref 必须是分支 / tag / 完整 40 位 SHA：给短 SHA 时 checkout 会把它当分支名去 fetch
          # (+refs/heads/<sha>*)，GitHub 找不到 → `git.exe failed with exit code 1`（2026-10-16 首跑实测）。
          ref: ${{ inputs.ref || github.sha }}

      - name: Install CUDA ${{ inputs.cuda_version }}
        shell: pwsh
        run: |
          $short = '${{ inputs.cuda_short }}'
          $installer = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cuda/${{ inputs.cuda_version }}/network_installers/${{ inputs.cuda_installer }}' -OutFile $installer
          $packages = 'nvcc crt nvvm cudart cublas_dev nvtx thrust cuda_profiler_api'.Split(' ') | ForEach-Object { "${_}_$short" }
          $p = Start-Process -FilePath $installer -ArgumentList (@('-s') + $packages) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CUDA installer exited with $($p.ExitCode)" }
          $cuda = "${env:ProgramFiles}\NVIDIA GPU Computing Toolkit\CUDA\v$short"
          foreach ($f in 'bin\nvcc.exe', 'include\cuda_runtime.h', 'include\crt\host_config.h', 'lib\x64\cublas.lib') {
            if (-not (Test-Path -LiteralPath (Join-Path $cuda $f))) { throw "the CUDA install lacks $f" }
          }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$cuda\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Visual Studio 2022 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio 2022 with the x64 toolset' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notin 'VCPKG_ROOT', 'CUDA_PATH') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          python -m pip install --quiet ninja

      # 编译缓存：sccache 只拦 cl（C/C++ 编译单元），nvcc 不走它（sccache 不支持）→
      # CUDA .cu 部分不缓存，主体 C++ 部分命中缓存。缓存目录放 D:（build 也在 D:），
      # actions/cache 在 run 间保留（runner 本身每次干净）。
      - name: Install sccache ${{ inputs.sccache_version }}
        shell: pwsh
        run: |
          $ver = '${{ inputs.sccache_version }}'
          # 只接受 x.y.z 版本号：该值会进 URL 和 PATH，白名单防注入
          if ($ver -notmatch '^[0-9]+(\.[0-9]+)*$') { throw "refusing sccache version '$ver'" }
          $zip = Join-Path $env:RUNNER_TEMP "sccache-v$ver.zip"
          $url = "https://github.com/mozilla/sccache/releases/download/v$ver/sccache-v$ver-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'C:\sccache' -Force
          $exe = Get-ChildItem -Path 'C:\sccache' -Recurse -Filter 'sccache.exe' | Select-Object -First 1
          if (-not $exe) { throw 'sccache.exe not found after extract' }
          & $exe.FullName --version
          "$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $cacheDir = 'D:\sccache-cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "SCCACHE_DIR=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 构建结束即关 sccache server，别在 actions/cache 存档时还占着缓存文件句柄
          "SCCACHE_IDLE_TIMEOUT=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 依赖 shim：cmake/Dependencies.cmake 与 FindFFMPEG 把 VCPKG_ROOT + VCPKG_TARGET_TRIPLET 当硬前提，
      # 且只在该布局下找 av*.lib / 头文件 / DLL。FFmpeg 与 curl 的 MSVC import lib 从各自 DLL 的导出表现场造
      # （curl.se 只发 mingw 包、MSVC 链不了 .dll.a；BtbN 的 ffmpeg 包同理）。
      - name: FFmpeg, curl and zlib into a vcpkg-shaped tree
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'deps'
          $triplet = 'x64-windows-msvc'
          $tree = Join-Path $deps "installed\$triplet"
          New-Item -ItemType Directory -Force -Path "$tree\include", "$tree\lib", "$tree\bin" | Out-Null

          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip' -OutFile "$deps\ffmpeg.zip"
          Expand-Archive -Path "$deps\ffmpeg.zip" -DestinationPath $deps
          $ff = (Get-ChildItem -Path $deps -Directory -Filter 'ffmpeg-*' | Select-Object -First 1).FullName
          Copy-Item -Recurse -Path "$ff\include\*" -Destination "$tree\include"
          Copy-Item -Path "$ff\bin\*.dll" -Destination "$tree\bin"

          Invoke-WebRequest -Uri 'https://curl.se/windows/latest.cgi?p=win64-mingw.zip' -OutFile "$deps\curl.zip"
          Expand-Archive -Path "$deps\curl.zip" -DestinationPath $deps
          $curl = (Get-ChildItem -Path $deps -Directory -Filter 'curl-*' | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$tree\include\curl" | Out-Null
          # 目标必须是 <tree>/include/curl/curl.h（本机 shim 实测）；直接拷 $curl\include\* 会写成 include/curl/curl/…
          Copy-Item -Recurse -Path "$curl\include\curl\*" -Destination "$tree\include\curl"
          Copy-Item -Path "$curl\bin\libcurl-x64.dll" -Destination "$tree\bin"

          function New-MsvcImportLib([string]$dll, [string]$outLib) {
            $names = & dumpbin /nologo /exports $dll | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)\s*$') { $Matches[1] }
            } | Where-Object { $_ }
            if (-not $names) { throw "no exports parsed from $dll" }
            $defPath = [IO.Path]::ChangeExtension($outLib, '.def')
            [IO.File]::WriteAllText($defPath, "LIBRARY $(Split-Path $dll -Leaf)`nEXPORTS`n" + ($names -join "`n") + "`n")
            & lib /nologo "/DEF:$defPath" "/OUT:$outLib" /MACHINE:X64
            if ($LASTEXITCODE -ne 0) { throw "lib.exe failed for $dll" }
          }
          foreach ($name in 'avformat', 'avcodec', 'avutil', 'swscale', 'swresample', 'avfilter', 'avdevice') {
            $dll = (Get-ChildItem -Path "$ff\bin" -Filter "$name-*.dll" | Select-Object -First 1).FullName
            New-MsvcImportLib $dll "$tree\lib\$name.lib"
          }
          New-MsvcImportLib "$curl\bin\libcurl-x64.dll" "$tree\lib\libcurl.lib"

          # zlib：**必须**是真库 —— 0 字节 stub 会让 MSVC 报 `LNK1136: invalid or corrupt file`（2026-10-16 实测），
          # 而 png_decode.cpp 真的 include zlib.h / 调 inflate。按本机配方从源码编 1.3.1（nmake 已在 VS 环境里）：
          $zsrc = Join-Path $env:RUNNER_TEMP 'zlib-1.3.1'
          Invoke-WebRequest -Uri 'https://github.com/madler/zlib/releases/download/v1.3.1/zlib131.zip' -OutFile "$env:RUNNER_TEMP\zlib131.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zlib131.zip" -DestinationPath $env:RUNNER_TEMP -Force
          Push-Location $zsrc
          & nmake -nologo -f win32\Makefile.msc 'ZLIB_COMPAT=' 'LDFLAGS='
          if ($LASTEXITCODE -ne 0) { throw "zlib build failed ($LASTEXITCODE)" }
          Pop-Location
          Copy-Item (Join-Path $zsrc 'zlib.lib') "$tree\lib\z.lib"
          Copy-Item (Join-Path $zsrc 'zlib.h'), (Join-Path $zsrc 'zconf.h') -Destination "$tree\include" -Force
          $zl = Get-Item "$tree\lib\z.lib"
          "z.lib size = $($zl.Length) bytes"
          if ($zl.Length -lt 1024) { throw "z.lib is empty ($($zl.Length) bytes): the link step would fail with LNK1136" }
          & lib /nologo /list:"$tree\lib\z.lib" | Measure-Object -Line | ForEach-Object { "z.lib archive members = $($_.Lines)" }
          "VCPKG_ROOT=$deps" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TARGET_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "$tree\lib" | Select-Object -ExpandProperty Name

      - name: Diagnose toolchain and deps
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          ninja --version
          nvcc --version | Select-Object -Last 2
          "VCPKG_ROOT=$env:VCPKG_ROOT"
          "VCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET"
          "CUDA_PATH=$env:CUDA_PATH"
          Get-PSDrive C | Select-Object @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-List
          $tree = "$env:VCPKG_ROOT\installed\$env:VCPKG_TARGET_TRIPLET"
          if (Test-Path $tree) { Get-ChildItem -Recurse -File $tree | Select-Object -First 40 -ExpandProperty FullName }
          else { "MISSING: $tree" }
          Get-ChildItem "$env:VCPKG_ROOT\installed\$env:VCPKG_TARGET_TRIPLET\lib" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

      # 全量 build 目录缓存（比 sccache 更进一步：nvcc 编出的 CUDA .obj 也缓存）。
      # 热 run（同 commit）= restore 后 ninja 判定 no work to do → 只剩依赖下载+链接（~20-30 分钟）。
      # 冷 run 时 restore 落空，行为与无缓存完全一致。CMakeCache/ninja 图按路径+内容哈希追踪，
      # GHA workspace 路径（D:\a\ninfer-all\ninfer-all）跨 run 固定；镜像 toolchain 变了
      # CMake 会自动重配置 → 最坏退回全量，不会编坏。
      - name: Restore build directory
        uses: actions/cache/restore@v4
        with:
          path: build
          key: build-sm89-${{ matrix.scope }}-${{ github.sha }}
          restore-keys: |
            build-sm89-${{ matrix.scope }}-
            build-sm89-

      - name: Configure
        shell: pwsh
        run: |
          $flags = @()
          if ('${{ matrix.scope }}' -eq 'apps') {
            $flags += '-DNINFER_BUILD_APPS=ON', '-DNINFER_BUILD_BENCHMARKS=OFF'
          } else {
            $flags += '-DNINFER_BUILD_APPS=OFF', '-DNINFER_BUILD_BENCHMARKS=ON'
          }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES=89 "-DCMAKE_CUDA_COMPILER=$env:CUDA_PATH\bin\nvcc.exe" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_TESTING=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=OFF -DCMAKE_CUDA_USE_RESPONSE_FILE_FOR_INCLUDES=OFF `
            @flags
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: D:\sccache-cache
          key: sccache-sm89-${{ matrix.scope }}-${{ github.sha }}
          restore-keys: |
            sccache-sm89-${{ matrix.scope }}-
            sccache-sm89-

      - name: Build
        shell: pwsh
        run: |
          # 探活：restore 来的 build 目录若与当前源码一致，ninja 无事可做 → 跳过编译与 sccache 自检
          $probe = (& ninja -C build -n) -join "`n"
          $willCompile = $probe -match '(Building CXX object|Building CUDA object)'
          if ($probe -match 'no work to do') {
            "warm build: no work to do (restored build dir is up to date)"
          } else {
            cmake --build build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
            if ($willCompile) {
              # 防静默失效：launcher 没生效时 sccache 不会写缓存，构建照常全量编译、看起来一切正常
              $stats = (& sccache --show-stats) -join "`n"
              $stats
              if ($stats -notmatch 'Cache misses\s+[1-9]') { throw "sccache wrote nothing to the cache: the CMAKE_*_COMPILER_LAUNCHER hook is not working" }
              # 防"缓存了但依赖没跟踪"：sccache 靠 /showIncludes 解析 MSVC 依赖；缺了它缓存命中时
              # 改头文件不触发重编 → 热缓存 run 可能编出陈旧对象。这里强制失败，别把风险留到下次
              $cmds = (& ninja -C build -t commands) -join "`n"
              if ($cmds -notmatch '/showIncludes') { throw "MSVC cl invocations lack /showIncludes: sccache cannot track dependencies; warm-cache builds would be unsafe" }
            }
          }

      - name: Save sccache cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: D:\sccache-cache
          key: sccache-sm89-${{ matrix.scope }}-${{ github.sha }}

      - name: Save build directory
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: build
          key: build-sm89-${{ matrix.scope }}-${{ github.sha }}

      - name: Stage artifact
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD)
          $out = "dist/ninfer-sm89-$sha-${{ matrix.scope }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if ('${{ matrix.scope }}' -eq 'apps') {
            Copy-Item -Path 'build/apps/*.exe' -Destination $out
          } else {
            Copy-Item -Path 'build/bench/*.exe' -Destination $out
          }
          Copy-Item -Path "$env:VCPKG_ROOT\installed\$env:VCPKG_TARGET_TRIPLET\bin\*.dll" -Destination $out
          # ⚠️ 两个坑（2026-10-16 run 38906774516 实测）：
          #  1) Get-ChildItem 在管道里是惰性的：Out-File 收到第一个元素就打开 SHA256SUMS.txt，
          #     而此刻枚举才真正执行 → 刚创建的 SHA256SUMS.txt 被列入 → Get-FileHash 去读一个
          #     被 Out-File 占着写句柄的文件 → "The process cannot access the file ... being used by another process"
          #     → 必须先把清单物化成数组，并显式排除 SHA256SUMS.txt
          #  2) Windows Defender 会扫刚写出的大 exe 并短暂锁文件 → hash 套重试
          function Get-RetryHash([string]$path) {
            $tries = 0
            while ($true) {
              try { return (Get-FileHash $path -Algorithm SHA256).Hash.ToLower() }
              catch {
                $tries++
                if ($tries -ge 15) { throw }
                Start-Sleep -Seconds 2
              }
            }
          }
          $files = @(Get-ChildItem $out -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' })
          $lines = foreach ($f in $files) { "$(Get-RetryHash $f.FullName)  $($f.Name)" }
          $tmp = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $lines | Out-File -FilePath $tmp -Encoding ascii
          Move-Item -Path $tmp -Destination "$out/SHA256SUMS.txt" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ninfer-sm89-${{ matrix.scope }}-${{ github.sha }}
          path: dist/
          retention-days: 30
